name: Hubitat CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff

      - name: Syntax Compilation Check
        run: |
          python -m py_compile main.py
          python -m compileall -q .

      - name: Run Static Analysis (Ruff)
        run: |
          ruff check . --exit-zero

      - name: Run Flake8 Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  deploy-check:
    name: Deploy Readiness Check
    needs: lint-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Environment Configuration Sanity Check
        run: |
          test -f .env.example || exit 1
          echo "Status: Repositório validado para deploy de produção."
